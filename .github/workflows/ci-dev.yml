name: CI (dev)

# Light gate for task PRs into dev: fast, about a minute.
# Heavy checks (unit tests, e2e, Lighthouse) only run on PRs into main.

on:
  pull_request:
    branches: [dev]

concurrency:
  group: ci-dev-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick-check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
